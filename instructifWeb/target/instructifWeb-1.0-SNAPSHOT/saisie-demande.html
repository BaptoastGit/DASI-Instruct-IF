<!DOCTYPE html>

<html>

    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="style.css">
        <script>
            async function creerDemande() {
                console.log("creer demande");
                let url = "./ActionServlet?todo=creerDemande";
                let jsonResponse = await fetch(url)
                        .then(
                                function (httpResponse) {
                                    return httpResponse.json();
                                }
                        )
                        .catch(
                                function (error) {
                                    console.log(error);
                                    return null;
                                }
                        );

                console.log(jsonResponse);
                if (jsonResponse) {
                    console.log("Demande cree avec succès");

                } else {
                    console.log("Demande ratée, aucun succès");
                }

            }
            ;


        </script>
    </head>

    <body>
        <div class="layout-pages">


            <aside class="cont_infos_laterales">
                <h1>INSTRUCT'IF</h1>
                <h2 class="texte-description moyen"> Espace elève</h2>
                <div class="trait"></div>
            </aside>
            <aside class="page gris" id="cont_demande">
                <a href="choix-matiere.html">Retour</a>
                <h1>Décris ta demande</h1>
                <h2>Plus tu es précis•e, mieux l'intervenant pourra t'aider</h2>
                <input placeholder="Décris ta difficulté ou ta question... Par exemple: je ne comprends pas comment résoudre les équations du second degré quand le discriminant est négatif" id="input_demande"/>


                <button onclick="creerDemande()" id="envoyer_demande">Envoyer ma demande</button>


                <a href="./choix-matiere.html">Retour</a>

            </aside>
        </div>

    </body>

</html>
