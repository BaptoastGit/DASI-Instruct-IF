<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <script src="panneau-lateral.js" defer></script>
    <script>
        window.onload = () => {
            document.getElementById("theme-choisi").innerHTML = sessionStorage.getItem("theme-choisi")
            document.getElementById("matiere-choisie").innerHTML = sessionStorage.getItem("matiere-choisie")

        }
        async function creerDemande() {
            console.log("creer demande");
            let url = "./ActionServlet?todo=creerDemande";
            let jsonResponse = await fetch(url)
                .then(
                    function (httpResponse) {
                        return httpResponse.json();
                    }
                )
                .catch(
                    function (error) {
                        console.log(error);
                        return null;
                    }
                );

            console.log(jsonResponse);
            if (jsonResponse) {
                console.log("Demande cree avec succès");

            }
            else {
                console.log("Demande ratée, aucun succès");
            }

        };
        function actualiserCompteur(element) {
            document.getElementById("compteur-carac").innerHTML = element.value.length + " / 500";
        }


    </script>
</head>

<body>
    <div class="layout-pages">

        <panneau-lateral></panneau-lateral>
        <aside class="page gris" id="cont_pages">
            <a class="texte-description" style="display: inline-block; margin-bottom: 10px;" href="choix-matiere.html">
                &lt Retour</a>

            <div style="display:flex; gap:15px ; justify-content: left;">
                <div class="text-pilule moyen bleute" id="matiere-choisie"></div>
                <div class="text-pilule moyen grise" id="theme-choisi"></div>
            </div>
            <h1>Décris ta demande</h1>
            <h2 class="texte-description moyen ">Plus tu es précis•e, mieux l'intervenant pourra t'aider</h2>

            <div class="bloc demande blanc margin-bot">
                <h2 style="margin-left:10px" class="gauche moyen"> Ta question ou difficulté</h2>
                <textarea oninput="actualiserCompteur(this)" style="height: 300px; width: 97%; resize: vertical;"
                    placeholder="Décris ta difficulté ou ta question... Par exemple: je ne comprends pas comment résoudre les équations du second degré quand le discriminant est négatif"
                    id="input_demande"></textarea>
                <h3 class="texte-description petit droite" id="compteur-carac"> 0 / 500</h3>
            </div>

            <div style="display:flex; gap:15px ; justify-content: right; max-width: 61vw;">
                <a class="btn-transparent droite" href="./choix-matiere.html">Retour</a>
                <a class="btn-bleu droite " onclick="creerDemande()" id="envoyer_demande">Envoyer ma demande</a>

            </div>





        </aside>



    </div>

</body>

</html>
